apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: umap-application
spec:
  project: default
  source:
    repoURL: https://github.com/mateomorin/LabelGuard-deployment.git
    targetRevision: main
    path: deployment
  destination:
    server: https://kubernetes.default.svc
    namespace: user-mamorin
  syncPolicy:
    automated:
      selfHeal: true